<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ps5-wh-widgets - custom widgets for the PS5 Welcome Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#111b2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#2ea8ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2ea8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e4ff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#66e4ff"/>
      <stop offset="1" stop-color="#66e4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a44"/>
      <stop offset="1" stop-color="#121c2f"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#20304c" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- widget tile motif -->
  <g transform="translate(806 62)">
    <rect x="0" y="0" width="150" height="80" rx="14" fill="url(#tile)" stroke="#2b4368"/>
    <rect x="0" y="0" width="150" height="80" rx="14" fill="none" stroke="#66e4ff" stroke-opacity="0.55"/>
    <circle cx="22" cy="24" r="5" fill="#66e4ff"/>
    <rect x="36" y="20" width="66" height="8" rx="4" fill="#8fa2bf" fill-opacity="0.75"/>
    <rect x="16" y="44" width="52" height="20" rx="6" fill="#7cf3bf" fill-opacity="0.85"/>
    <rect x="76" y="44" width="58" height="20" rx="6" fill="#2b4368"/>

    <rect x="162" y="0" width="150" height="80" rx="14" fill="url(#tile)" stroke="#2b4368"/>
    <rect x="176" y="18" width="42" height="42" rx="10" fill="#173e58"/>
    <circle cx="197" cy="39" r="10" fill="none" stroke="#66e4ff" stroke-width="3"/>
    <rect x="228" y="22" width="66" height="8" rx="4" fill="#8fa2bf" fill-opacity="0.75"/>
    <rect x="228" y="40" width="46" height="8" rx="4" fill="#3a5478"/>

    <rect x="0" y="94" width="150" height="80" rx="14" fill="url(#tile)" stroke="#2b4368"/>
    <rect x="16" y="112" width="118" height="8" rx="4" fill="#8fa2bf" fill-opacity="0.6"/>
    <rect x="16" y="128" width="92" height="8" rx="4" fill="#3a5478"/>
    <rect x="16" y="146" width="54" height="14" rx="7" fill="#66e4ff" fill-opacity="0.85"/>

    <rect x="162" y="94" width="150" height="80" rx="14" fill="url(#tile)" stroke="#2b4368"/>
    <rect x="162" y="94" width="150" height="80" rx="14" fill="none" stroke="#7cf3bf" stroke-opacity="0.35"/>
    <circle cx="188" cy="120" r="11" fill="#7cf3bf" fill-opacity="0.85"/>
    <rect x="208" y="114" width="88" height="8" rx="4" fill="#8fa2bf" fill-opacity="0.7"/>
    <rect x="176" y="146" width="120" height="6" rx="3" fill="#2b4368"/>
    <rect x="176" y="146" width="76" height="6" rx="3" fill="#7cf3bf" fill-opacity="0.8"/>
  </g>

  <!-- copy -->
  <text x="96" y="112" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#66e4ff">PLAYSTATION 5 · WELCOME HUB</text>
  <text x="94" y="176" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="700" fill="#f5f8ff">ps5-wh-widgets</text>
  <text x="96" y="214" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#8fa2bf">Custom widgets for the Welcome Hub</text>
  <rect x="96" y="238" width="330" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
